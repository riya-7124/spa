window.onpopstate = function() {

        showPage("quotePage");
    } else if (path === "/term-insurance/rider") {
        showPage("riderPage");
    } else {

    }
};

(function initializeApp() {
    var path = window.location.pathname;

    if (path === "/term-insurance/quote") {
        showPage("quotePage");
        fireQuotePageLoad();
    } else if (path === "/term-insurance/rider") {
        showPage("riderPage");
        fireRiderPageLoad();
    } else {
        if (path !== "/term-insurance") {
            history.replaceState({}, "", "/term-insurance");

        showPage("leadPage");
        fireLeadPageLoad();

})();
